name: annex-workforce-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: annex-postgres-test
    environment:
      POSTGRES_USER: annex
      POSTGRES_PASSWORD: annexpass
      POSTGRES_DB: annex
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annex"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis:
    image: redis:7-alpine
    container_name: annex-redis-test
    command: redis-server --requirepass redispass
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: annex-elasticsearch-test
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - test-network

  minio:
    image: minio/minio:latest
    container_name: annex-minio-test
    command: server /data
    environment:
      MINIO_ROOT_USER: annexminio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9002:9000"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
